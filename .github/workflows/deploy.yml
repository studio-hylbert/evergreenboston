name: Deploy to GitHub Pages

# The build reads no network: every outside source is fetched by its own
# refresh workflow and committed under content/cache/ first. So this runs on a
# push and nothing else — whoever or whatever changed the content, whether a
# person editing `content/` or a refresh job committing a new sermon list, the
# deploy that follows is the same and cannot be broken by a source being down.
on:
  push:
    branches: [main]
  # Called by each refresh workflow once it has committed a change. A push made
  # with GITHUB_TOKEN does not trigger `on: push` — GitHub suppresses it to stop
  # workflows looping — so a refresh job cannot rely on its own commit to reach
  # this workflow, and calls it instead.
  workflow_call:
  # Redeploys the committed content as-is, without waiting for a change.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A queued run replaces a waiting one, but never interrupts a deploy in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Resolve Pages URL
        id: pages
        uses: actions/configure-pages@v5
        # Pages is enabled on the repository with its source set to GitHub
        # Actions. This step only reads that configuration.

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          # A project repository is served from /<repo>, so both the base path
          # and the canonical URL come from the Pages configuration rather than
          # being written down twice.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.origin }}${{ steps.pages.outputs.base_path }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
