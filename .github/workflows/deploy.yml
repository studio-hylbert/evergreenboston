name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # The sermon list is read from the church's YouTube feed at build time, so a
  # new sermon only reaches the site when it is rebuilt.
  #
  # Worship is at 2pm ET on Sunday and the recording is uploaded afterwards,
  # but not on a fixed schedule. Across the 14 sermons in the feed the upload
  # landed between 5.6 and 34 hours after the service — from Sunday 23:00 UTC
  # to Tuesday 04:00 UTC. A single weekly run would have missed 4 of those 14
  # and held them back a full week, so this runs twice a day instead: whatever
  # the upload habit, a sermon is on the site within 12 hours.
  schedule:
    - cron: "0 6,18 * * *"
  # Publishes a new video immediately, without waiting for the next run.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A queued run replaces a waiting one, but never interrupts a deploy in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Resolve Pages URL
        id: pages
        uses: actions/configure-pages@v5
        # Pages is enabled on the repository with its source set to GitHub
        # Actions. This step only reads that configuration.

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          # A project repository is served from /<repo>, so both the base path
          # and the canonical URL come from the Pages configuration rather than
          # being written down twice.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.origin }}${{ steps.pages.outputs.base_path }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
