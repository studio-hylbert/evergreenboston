<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>보스톤늘푸른교회 | The Evergreen Church of Boston</title>
    <!--
      A static export has no server, so there is nothing to negotiate
      Accept-Language. This page picks a language in the browser and replaces
      itself. Search engines are sent to the two real trees instead of here.

      Every link is relative. This file is copied from public/ untouched, so
      Next does not apply `basePath` to it, and a project repository on GitHub
      Pages is served from /<repo> rather than /.
    -->
    <link rel="canonical" href="ko/" />
    <link rel="alternate" hreflang="ko" href="ko/" />
    <link rel="alternate" hreflang="en" href="en/" />
    <link rel="alternate" hreflang="x-default" href="ko/" />
    <meta name="robots" content="noindex" />
    <script>
      (function () {
        var supported = ["ko", "en"];
        var chosen = null;

        try {
          var saved = window.localStorage.getItem("locale");
          if (supported.indexOf(saved) !== -1) chosen = saved;
        } catch (e) {
          /* Private browsing can refuse storage; fall through to the browser. */
        }

        if (!chosen) {
          var prefs = navigator.languages || [navigator.language || "ko"];
          for (var i = 0; i < prefs.length && !chosen; i++) {
            var tag = String(prefs[i]).toLowerCase();
            for (var j = 0; j < supported.length; j++) {
              if (tag === supported[j] || tag.indexOf(supported[j] + "-") === 0) {
                chosen = supported[j];
                break;
              }
            }
          }
        }

        /* Resolve against this file's own directory, whatever it is mounted on. */
        var base = location.pathname.replace(/index\.html$/, "");
        if (base.charAt(base.length - 1) !== "/") base += "/";

        /* Korean is what the congregation worships in, so an unrecognised
           browser setting gets Korean. */
        location.replace(base + (chosen || "ko") + "/");
      })();
    </script>
  </head>
  <body>
    <noscript>
      <p><a href="ko/">한국어로 보기</a></p>
      <p><a href="en/">View in English</a></p>
    </noscript>
  </body>
</html>
